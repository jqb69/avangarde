---
# .github/workflows/deploy.yml
name: Deploy OpenClaw Sniper

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax Gate
        run: |
          python -m compileall -q run/ || {
            echo "Syntax error under run/ — refusing to deploy"
            exit 1
          }

      - name: Run Tests
        env:
          TG_SESSION_STR: "test_mode"
        run: |
          pip install -r run/requirements.txt
          pip install pytest pytest-asyncio
          python -m pytest test/test_openclaw.py

  build-and-deploy:
    permissions:
      contents: read
      packages: write
    needs: test
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: avanenv
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Secrets
        env:
          DIGITAL_OCEAN_IP: ${{ secrets.DIGITAL_OCEAN_IP }}
          DIGITAL_OCEAN_USER: ${{ secrets.DIGITAL_OCEAN_USER }}
          DIGITAL_OCEAN_SSH_KEY: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}
          TG_SESSION_STR: ${{ secrets.TG_SESSION_STR }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -eu
          for name in DIGITAL_OCEAN_IP DIGITAL_OCEAN_USER DIGITAL_OCEAN_SSH_KEY \
                    TG_SESSION_STR TG_API_HASH TG_API_ID DEEPSEEK_API_KEY GH_PAT; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is missing"
                exit 1
              fi
          done

      - name: Syntax Gate (pre-build)
        run: python -m compileall -q run/ || (echo "Syntax error — refusing image build" && exit 1)

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: run/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/avangarde:latest
            ghcr.io/${{ github.repository_owner }}/avangarde:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/avangarde:${{ github.run_id }}
            ghcr.io/${{ github.repository_owner }}/avangarde:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Optional true time stamp label
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
   
      - name: Verify image imports
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/avangarde:latest
          docker run --rm --entrypoint python \
            ghcr.io/${{ github.repository_owner }}/avangarde:latest \
            -c "import yaml; import utils.parsers; print('ci_image_ok')"


      - name: Copy deployment scripts to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DIGITAL_OCEAN_IP }}
          username: ${{ secrets.DIGITAL_OCEAN_USER }}
          key: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}
          source:  "docker-compose.yml,config.yaml,dos/*"
          target: "~/avangarde"
          strip_components: 0

      - name: SSH Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        env:
          TG_SESSION_STR: ${{ secrets.TG_SESSION_STR }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/avangarde:latest"
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          WIPE_REDIS: "0"
        with:
          host: ${{ secrets.DIGITAL_OCEAN_IP }}
          username: ${{ secrets.DIGITAL_OCEAN_USER }}
          key: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}
          envs: TG_SESSION_STR,TG_API_HASH,TG_API_ID,DEEPSEEK_API_KEY,IMAGE_NAME,GH_TOKEN,GH_ACTOR,WIPE_REDIS
          script: |
            chmod +x ~/avangarde/dos/rundos.sh
            ~/avangarde/dos/rundos.sh
